[package]
name = "tauri-app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.8.3"
winreg = "0.56"
# HEIC / HEIF 解码（纯 Rust，自带 HEVC intra 解码器，输出与 libheif 逐字节一致）
zune-heic = "0.5"

[target.'cfg(windows)'.dependencies]
# 关掉 WebView2 自带的浏览器快捷键要直接摸它的 COM 设置接口（版本跟 tauri 依赖的那份一致）
webview2-com = "0.39"
# 只为把 ICoreWebView2Settings 向上转型到带这一项设置的 ICoreWebView2Settings3
windows-core = "0.62"
# 作业对象：取消下载时一次性杀掉 yt-dlp 整棵进程树（PyInstaller 会派生真正干活的子进程）
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    # 电脑配置页：内存/开机时长、电源状态、显卡、分区
    "Win32_System_SystemInformation",
    "Win32_System_Power",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_WindowsProgramming",
    "Win32_System_Time",
    "Win32_UI_HiDpi",
] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
